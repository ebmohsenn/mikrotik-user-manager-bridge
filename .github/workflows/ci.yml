name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, sockets, mbstring
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint (php -l)
        run: composer lint

      - name: Coding standards (PHPCS)
        run: composer cs

      - name: Static analysis (PHPStan)
        run: composer stan -- --no-progress

      - name: Unit tests (PHPUnit)
        run: composer test

  node:
    name: Admin UI (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Jest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Check committed bundles match the source
        run: |
          git status --porcelain -- build health-dashboard
          if [ -n "$(git status --porcelain -- build health-dashboard)" ]; then
            echo "::error::admin/build or admin/health-dashboard is out of date. Run 'npm run build' in admin/ and commit the result."
            git --no-pager diff --stat -- build health-dashboard
            exit 1
          fi
          git diff --exit-code -- build health-dashboard
